<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Trainingsplan zum Abhaken: Sätze, Gewichte, Pausen-Timer, Verlauf und Körpergewicht – offline auf dem Handy.">
  <script>try { var t = localStorage.getItem('gym-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    (function () { var d = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
      document.querySelector('meta[name="theme-color"]').content = d ? '#000000' : '#f2f2f7'; })();</script>
  <title>Gym</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- iPhone: als Home-Bildschirm-App; Statusleiste passt sich Hell/Dunkel an (theme-color) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Gym">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <div id="topleft"></div>
    <h1 id="title">Training</h1>
    <div id="topright"></div>
  </header>

  <main id="view"></main>

  <div id="timer" class="glass" hidden></div>

  <nav id="tabs" class="glass">
    <button data-tab="home" aria-label="Home">
      <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 9.5V20h4.5v-5h3v5H18V9.5"/></svg>
      <span>Home</span>
    </button>
    <button data-tab="train" aria-label="Training">
      <svg viewBox="0 0 24 24"><path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/></svg>
      <span>Training</span>
    </button>
    <button data-tab="plan" aria-label="Plan">
      <svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
      <span>Plan</span>
    </button>
    <button data-tab="log" aria-label="Verlauf">
      <svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 5-6"/></svg>
      <span>Verlauf</span>
    </button>
    <button data-tab="more" aria-label="Mehr">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>
      <span>Mehr</span>
    </button>
  </nav>

  <div id="backdrop" hidden></div>
  <section id="sheet" class="glass" hidden></section>
  <div id="toast" hidden></div>

  <script src="js/core.js"></script>
  <script src="js/muscles.js"></script>
  <script src="js/home.js"></script>
  <script src="js/training.js"></script>
  <script src="js/plan.js"></script>
  <script src="js/history.js"></script>
  <script src="js/weight.js"></script>
  <script src="js/more.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
