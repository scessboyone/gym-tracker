  <script>try { var t = localStorage.getItem('gym-theme'); if (t) document.documentElement.dataset.theme = t;
    var a = localStorage.getItem('gym-accent'); if (a) document.documentElement.dataset.accent = a; } catch (e) {}
    (function () { var d = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
      document.querySelector('meta[name="theme-color"]').content = d ? '#000000' : '#f2f2f7';
      // iPhone: im Dunkelmodus läuft die App bis unter die Uhrzeit (weiße Schrift), hell bleibt die normale Leiste
      document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content = d ? 'black-translucent' : 'default'; })();</script>

<body>
  <header id="topbar">
    <div id="topleft"></div>
    <div id="topright"></div>
  </header>
  <h1 id="title">Training</h1>

  <main id="view"></main>

  <div id="timer" class="glass" hidden></div>

  <nav id="tabs" class="glass">
    <button data-tab="home" aria-label="Home">
      <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 9.5V20h4.5v-5h3v5H18V9.5"/></svg>
      <span>Home</span>
    </button>
    <button data-tab="train" aria-label="Training">
      <svg viewBox="0 0 24 24"><path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/></svg>
      <span>Training</span>
    </button>
    <button data-tab="plan" aria-label="Plan">
      <svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
      <span>Plan</span>
    </button>
    <button data-tab="log" aria-label="Verlauf">
      <svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 5-6"/></svg>
      <span>Verlauf</span>
    </button>
    <button data-tab="more" aria-label="Mehr">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>
      <span>Mehr</span>
    </button>
  </nav>

  <div id="backdrop" hidden></div>
  <section id="sheet" class="glass" hidden></section>
  <div id="toast" hidden></div>

  <script src="js/core.js"></script>
  <script src="js/muscles.js"></script>

  <script src="js/weight.js"></script>
  <script src="js/more.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/main.js"></script>
</body>
